name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: unidpp-server
      # The one server compiles the eight module crates and their
      # transitive path-deps, so the workflow checks out the family
      # (the siblings-adjacent layout the path deps require).
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-registry
          path: unidpp-registry
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-trust
          path: unidpp-trust
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-log
          path: unidpp-log
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-issuer
          path: unidpp-issuer
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-projector
          path: unidpp-projector
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-gateway
          path: unidpp-gateway
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-archive
          path: unidpp-archive
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-hub
          path: unidpp-hub
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-console
          path: unidpp-console
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-config
          path: unidpp-config
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-cli
          path: unidpp-cli
      - name: Format (rustfmt reads rust-toolchain.toml)
        working-directory: unidpp-server
        run: cargo fmt --all -- --check
      - name: Build
        working-directory: unidpp-server
        run: cargo build --release
      - name: Test
        working-directory: unidpp-server
        run: cargo test
      - name: Clippy
        working-directory: unidpp-server
        run: cargo clippy --all-targets -- -D warnings
