[package]
name = "unidpp-server"
version = "0.1.0"
edition = "2021"
description = "UniDPP one-server deployment: every module of the estate in one process (the REARCH consolidation)"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
serde_json = "1"
serde_yaml = "0.9"
unidpp-registry = { path = "../unidpp-registry" }
unidpp-trust = { path = "../unidpp-trust" }
unidpp-log = { path = "../unidpp-log" }
unidpp-issuer = { path = "../unidpp-issuer" }
unidpp-projector = { path = "../unidpp-projector" }
unidpp-gateway = { path = "../unidpp-gateway" }
unidpp-archive = { path = "../unidpp-archive" }
unidpp-hub = { path = "../unidpp-hub" }
unidpp-model = { path = "../unidpp-core/crates/model" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[[bin]]
name = "unidpp-server"
path = "src/main.rs"
